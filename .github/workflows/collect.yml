name: Boat data (free public repository only)

on:
  schedule:
    # Every 10 minutes during JST 08:00-23:59 and 01:00-01:59.
    - cron: '3,13,23,33,43,53 23,0-14,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - boatdata/**
      - .github/workflows/collect.yml
      - bootstrap-data.zip

permissions:
  contents: read

concurrency:
  group: boat-data-single-writer
  cancel-in-progress: false

jobs:
  collect:
    # This prevents private repository runs from consuming paid Actions minutes.
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOAT_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Restore, collect, preserve, and update Pages branch
        run: python -m boatdata.github_cycle
      - name: Run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=Path('cycle-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              if report.exists():
                  value=json.loads(report.read_text(encoding='utf-8'))
                  f.write('保存世代: '+value['manifest_generation']+'\n\n')
                  for day in value['days']:
                      errors=[s['source'] for s in day['sources'] if s['error']]
                      f.write(day['day']+': 取得元のエラー '+(', '.join(errors) or 'なし')+'\n\n')
              else:
                  f.write('収集レポート未生成。失敗したステップのログを確認してください。\n')
          PY
